services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: fleet_tracker
      POSTGRES_USER: fleet_tracker
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fleet_tracker_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: